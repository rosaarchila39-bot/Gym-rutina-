<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>Mi Rutina Gym</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#1f2937;
}
header{
  background:#111827;
  color:white;
  padding:28px 18px 22px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0;opacity:.8}

.container{max-width:800px;margin:auto;padding:16px}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:10px;
}
.tab{
  border:0;
  background:white;
  border-radius:12px;
  padding:11px 14px;
  white-space:nowrap;
  font-weight:600;
}
.tab.active{
  background:#111827;
  color:white;
}

.card{
  background:white;
  border-radius:18px;
  padding:17px;
  margin:13px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.card h2,.card h3{margin-top:0}

.exercise{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:15px;
  margin:12px 0;
}
.exercise h3{margin:0 0 5px}
.muscle{font-size:13px;color:#6b7280}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}
label{
  font-size:12px;
  color:#6b7280;
  display:block;
}
input,select,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:10px;
  margin-top:4px;
  font-size:16px;
  background:white;
}
textarea{min-height:65px;resize:vertical}

.series{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}
.series label{
  background:#f3f4f6;
  padding:8px;
  border-radius:10px;
  color:#374151;
}
.series input[type=checkbox]{
  width:auto;
  margin-right:5px;
}

button{
  cursor:pointer;
}
.primary{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#111827;
  color:white;
  font-weight:700;
  font-size:16px;
  margin-top:10px;
}
.secondary{
  border:1px solid #d1d5db;
  background:white;
  border-radius:11px;
  padding:10px 13px;
}
.danger{
  background:#fee2e2;
  color:#991b1b;
  border:0;
}

.hidden{display:none}

.progress{
  height:9px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}
.progress div{
  height:100%;
  background:#111827;
  width:0%;
  transition:.3s;
}

.history-item{
  border-bottom:1px solid #eee;
  padding:13px 0;
}
.history-item:last-child{border-bottom:0}

.stat{
  text-align:center;
  background:#f3f4f6;
  border-radius:14px;
  padding:14px 7px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat strong{
  display:block;
  font-size:22px;
}

.exercise-info{
  background:#f9fafb;
  border-radius:11px;
  padding:11px;
  font-size:14px;
  margin-top:10px;
  line-height:1.45;
}

.stretch{
  display:flex;
  gap:8px;
  align-items:center;
  padding:9px 0;
}
.stretch input{width:auto}

.small{
  font-size:12px;
  color:#6b7280;
}
</style>
</head>

<body>

<header>
  <h1>🏋️ Mi Rutina Gym</h1>
  <p>Entrena · Registra · Progresa</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="showDay(1)">Día 1</button>
    <button class="tab" onclick="showDay(2)">Día 2</button>
    <button class="tab" onclick="showDay(3)">Día 3</button>
    <button class="tab" onclick="showDay(4)">Día 4</button>
    <button class="tab" onclick="showDay(5)">Día 5</button>
    <button class="tab" onclick="showHistory()">📊 Historial</button>
  </div>

  <div id="app"></div>

</div>

<script>

const STORAGE = "miRutinaGym2026";

let data = JSON.parse(localStorage.getItem(STORAGE)) || {
  sessions: {},
  currentDay: 1
};

/*
=========================================================
RUTINA
=========================================================

Los ejercicios que sí quedaron definidos en nuestra
conversación están incluidos.

Puedes añadir más ejercicios fácilmente en cada array.
*/

const routine = {

1:{
 name:"Día 1 — Glúteos",
 warmup:[
  "5–8 min de caminata, bicicleta o elíptica",
  "Movilidad de cadera",
  "Activación de glúteos con banda"
 ],
 exercises:[
  {
   name:"Hip Thrust",
   muscle:"Glúteo mayor",
   sets:4,
   reps:"8–12",
   rest:"90–120 s",
   info:"Empuja con los talones, mantén la pelvis estable y aprieta el glúteo arriba."
  },
  {
   name:"Sentadilla búlgara",
   muscle:"Glúteos y piernas",
   sets:3,
   reps:"8–12 por pierna",
   rest:"90 s",
   info:"Mantén el tronco ligeramente inclinado y controla la bajada."
  },
  {
   name:"Máquina de aducción",
   muscle:"Aductores",
   sets:3,
   reps:"12–15",
   rest:"60–75 s",
   info:"Controla el movimiento y evita hacer rebotes."
  }
 ],
 stretch:[
  "Estiramiento de glúteos",
  "Estiramiento de flexores de cadera",
  "Estiramiento de cuádriceps",
  "Respiración y vuelta a la calma"
 ]
},

2:{
 name:"Día 2 — Tren superior",
 warmup:[
  "5–8 min de cardio suave",
  "Movilidad de hombros",
  "Activación escapular"
 ],
 exercises:[
  {
   name:"Press / ejercicio principal de pecho",
   muscle:"Pecho",
   sets:3,
   reps:"8–12",
   rest:"90 s",
   info:"Mantén el movimiento controlado y evita bloquear los codos."
  },
  {
   name:"Remo",
   muscle:"Espalda",
   sets:3,
   reps:"8–12",
   rest:"90 s",
   info:"Lleva los codos hacia atrás y mantén el torso estable."
  },
  {
   name:"Ejercicio de hombros",
   muscle:"Hombros",
   sets:3,
   reps:"10–15",
   rest:"60–90 s",
   info:"Utiliza un peso que te permita controlar todo el recorrido."
  }
 ],
 stretch:[
  "Estiramiento de espalda",
  "Estiramiento de hombros",
  "Estiramiento de brazos",
  "Respiración y vuelta a la calma"
 ]
},

3:{
 name:"Día 3 — Pierna",
 warmup:[
  "5–8 min de cardio suave",
  "Movilidad de tobillos y cadera",
  "Activación de piernas"
 ],
 exercises:[
  {
   name:"Hack inclinada",
   muscle:"Cuádriceps y glúteos",
   sets:3,
   reps:"8–12",
   rest:"90–120 s",
   info:"Mantén los pies firmes y controla la profundidad."
  },
  {
   name:"Prensa / ejercicio principal de pierna",
   muscle:"Piernas",
   sets:3,
   reps:"8–12",
   rest:"90 s",
   info:"Evita despegar la zona lumbar del respaldo."
  },
  {
   name:"Máquina Matrix",
   muscle:"Piernas",
   sets:3,
   reps:"10–15",
   rest:"60–90 s",
   info:"Realiza el recorrido completo de manera controlada."
  }
 ],
 stretch:[
  "Estiramiento de cuádriceps",
  "Estiramiento de femorales",
  "Estiramiento de pantorrillas",
  "Movilidad suave de cadera"
 ]
},

4:{
 name:"Día 4 — Glúteos y femorales",
 warmup:[
  "5–8 min de cardio",
  "Movilidad de cadera",
  "Activación de glúteos"
 ],
 exercises:[
  {
   name:"Ejercicio principal de glúteos",
   muscle:"Glúteos",
   sets:4,
   reps:"8–12",
   rest:"90–120 s",
   info:"Prioriza la técnica y la conexión mente-músculo."
  },
  {
   name:"Ejercicio de femorales",
   muscle:"Isquiotibiales",
   sets:3,
   reps:"10–12",
   rest:"75–90 s",
   info:"Controla especialmente la fase de regreso."
  },
  {
   name:"Abducción de cadera",
   muscle:"Glúteo medio",
   sets:3,
   reps:"12–20",
   rest:"60 s",
   info:"No balancees el cuerpo. Mantén tensión durante todo el ejercicio."
  }
 ],
 stretch:[
  "Estiramiento de femorales",
  "Estiramiento de glúteos",
  "Estiramiento de flexores de cadera",
  "Respiración"
 ]
},

5:{
 name:"Día 5 — Pierna / complemento",
 warmup:[
  "5–8 min de cardio suave",
  "Movilidad de cadera y tobillo",
  "Activación específica"
 ],
 exercises:[
  {
   name:"Ejercicio principal de pierna",
   muscle:"Piernas",
   sets:3,
   reps:"8–12",
   rest:"90–120 s",
   info:"Prioriza una técnica sólida antes de aumentar peso."
  },
  {
   name:"Hammer Strength",
   muscle:"Según máquina utilizada",
   sets:3,
   reps:"8–12",
   rest:"90 s",
   info:"Ajusta el asiento y realiza el movimiento de forma controlada."
  },
  {
   name:"Ejercicio complementario",
   muscle:"Piernas",
   sets:3,
   reps:"10–15",
   rest:"60–90 s",
   info:"Mantén una ejecución lenta y controlada."
  }
 ],
 stretch:[
  "Estiramiento general de piernas",
  "Glúteos",
  "Femorales",
  "Cuádriceps",
  "Respiración y vuelta a la calma"
 ]
}

};


function save(){
 localStorage.setItem(STORAGE,JSON.stringify(data));
}


function today(){
 const d=new Date();
 return d.toISOString().split("T")[0];
}


function getSession(day){
 const key=today()+"_d"+day;

 if(!data.sessions[key]){
  data.sessions[key]={
   date:today(),
   day:day,
   exercises:{},
   warmup:false,
   stretch:{},
   finished:false
  };
 }

 return data.sessions[key];
}


function showDay(day){

 data.currentDay=day;
 save();

 document.querySelectorAll(".tab").forEach((b,i)=>{
   b.classList.toggle("active",i===day-1);
 });

 const r=routine[day];
 const s=getSession(day);

 let html=`
 <div class="card">
   <h2>${r.name}</h2>
   <div class="small">📅 ${formatDate(today())}</div>
 </div>

 <div class="card">
   <h3>🔥 Calentamiento</h3>
   ${r.warmup.map((x,i)=>`
    <div class="stretch">
     <input type="checkbox"
      ${s.warmup===true?"checked":""}
      onchange="setWarmup(${day},this.checked)">
     <span>${x}</span>
    </div>
   `).join("")}
 </div>
 `;

 r.exercises.forEach((ex,index)=>{

  const saved=s.exercises[index]||{
   weight:"",
   reps:Array(ex.sets).fill(""),
   checked:Array(ex.sets).fill(false),
   rpe:"",
   notes:""
  };

  html+=`
  <div class="exercise">

    <h3>${ex.name}</h3>
    <div class="muscle">${ex.muscle}</div>

    <div class="exercise-info">
      <b>🎯 Objetivo:</b> ${ex.reps} repeticiones ·
      <b>⏱️ Descanso:</b> ${ex.rest}<br><br>
      ${ex.info}
    </div>

    <div class="grid">
      <label>
        Peso utilizado
        <input type="number"
          inputmode="decimal"
          value="${saved.weight}"
          placeholder="kg"
          onchange="saveWeight(${day},${index},this.value)">
      </label>

      <label>
        RPE / dificultad
        <select onchange="saveRPE(${day},${index},this.value)">
          <option value="">Seleccionar</option>
          ${[5,6,7,8,9,10].map(n=>
           `<option ${saved.rpe==n?"selected":""}>${n}</option>`
          ).join("")}
        </select>
      </label>
    </div>

    <div class="series">
      ${Array.from({length:ex.sets},(_,i)=>`
       <label>
        <input type="checkbox"
         ${saved.checked[i]?"checked":""}
         onchange="toggleSet(${day},${index},${i},this.checked)">
        Serie ${i+1}
       </label>
      `).join("")}
    </div>

    <div class="grid">
      ${Array.from({length:ex.sets},(_,i)=>`
       <label>
        Reps S${i+1}
        <input type="number"
         inputmode="numeric"
         value="${saved.reps[i]||""}"
         placeholder="reps"
         onchange="saveRep(${day},${index},${i},this.value)">
       </label>
      `).join("")}
    </div>

    <label style="margin-top:12px">
      📝 Notas
      <textarea
       placeholder="¿Cómo te sentiste? ¿Subiste peso? ¿Alguna molestia?"
       onchange="saveNotes(${day},${index},this.value)"
      >${saved.notes||""}</textarea>
    </label>

  </div>
  `;
 });


 html+=`
 <div class="card">
   <h3>🧘‍♀️ Estiramiento y vuelta a la calma</h3>

   ${r.stretch.map((x,i)=>`
    <div class="stretch">
      <input type="checkbox"
       ${s.stretch[i]?"checked":""}
       onchange="toggleStretch(${day},${i},this.checked)">
      <span>${x}</span>
    </div>
   `).join("")}

   <button class="primary" onclick="finishSession(${day})">
     ✅ Guardar entrenamiento del día
   </button>
 </div>
 `;

 document.getElementById("app").innerHTML=html;
}


function setWarmup(day,value){
 getSession(day).warmup=value;
 save();
}


function ensureExercise(day,index){
 const ex=routine[day].exercises[index];
 const s=getSession(day);

 if(!s.exercises[index]){
  s.exercises[index]={
   weight:"",
   reps:Array(ex.sets).fill(""),
   checked:Array(ex.sets).fill(false),
   rpe:"",
   notes:""
  };
 }
 return s.exercises[index];
}


function saveWeight(day,index,value){
 ensureExercise(day,index).weight=value;
 save();
}


function saveRPE(day,index,value){
 ensureExercise(day,index).rpe=value;
 save();
}


function saveRep(day,index,set,value){
 ensureExercise(day,index).reps[set]=value;
 save();
}


function saveNotes(day,index,value){
 ensureExercise(day,index).notes=value;
 save();
}


function toggleSet(day,index,set,value){
 ensureExercise(day,index).checked[set]=value;
 save();
}


function toggleStretch(day,index,value){
 getSession(day).stretch[index]=value;
 save();
}


function finishSession(day){

 const s=getSession(day);
 s.finished=true;
 s.completedAt=new Date().toISOString();

 save();

 alert("🎉 ¡Entrenamiento guardado! Puedes volver cuando quieras y tus datos seguirán aquí.");

 showDay(day);
}


function formatDate(date){
 const d=new Date(date+"T12:00:00");

 return d.toLocaleDateString("es-CO",{
  weekday:"long",
  day:"numeric",
  month:"long",
  year:"numeric"
 });
}


function showHistory(){

 document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));

 let sessions=Object.values(data.sessions)
  .sort((a,b)=>b.date.localeCompare(a.date));

 let completed=sessions.filter(s=>s.finished).length;

 let html=`
 <div class="card">
  <h2>📊 Mi progreso</h2>

  <div class="stats">
   <div class="stat">
    <strong>${completed}</strong>
    entrenamientos
   </div>
   <div class="stat">
    <strong>${Object.keys(data.sessions).length}</strong>
    sesiones
   </div>
   <div class="stat">
    <strong>🔥</strong>
    constancia
   </div>
  </div>
 </div>

 <div class="card">
  <h3>📅 Historial</h3>
 `;

 if(!sessions.length){
  html+=`<p>Aún no tienes entrenamientos registrados.</p>`;
 }

 sessions.forEach(s=>{

  const name=routine[s.day]?.name || "Entrenamiento";

  html+=`
   <div class="history-item">
    <b>${name}</b><br>
    <span class="small">${formatDate(s.date)}</span><br>
    ${s.finished ? "✅ Completado" : "🟡 En progreso"}
   </div>
  `;
 });

 html+=`
 </div>

 <div class="card">
  <h3>💾 Mis datos</h3>

  <button class="primary" onclick="exportData()">
   📥 Exportar historial
  </button>

  <button class="primary danger" onclick="clearData()">
   🗑️ Borrar todos mis datos
  </button>

  <p class="small">
   Tus registros se guardan automáticamente en este navegador.
  </p>
 </div>
 `;

 document.getElementById("app").innerHTML=html;
}


function exportData(){

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="historial-gimnasio.json";
 a.click();

 URL.revokeObjectURL(url);
}


function clearData(){

 if(confirm("¿Seguro que quieres borrar TODO tu historial? Esta acción no se puede deshacer.")){
  localStorage.removeItem(STORAGE);

  data={
   sessions:{},
   currentDay:1
  };

  showDay(1);
 }
}


showDay(1);

</script>

</body>
</html>
